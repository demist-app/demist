appId: app.demist.desktop
productName: Demist
files:
  - main.js
  - preload.js
  - native/**/*
  - licenses/**/*
  # The transcription models, fetched by scripts/fetch-models.mjs. Shipping
  # them is what stops first-run transcription depending on a Hugging Face
  # download that Store certification watched fail (10.1.2.10). 315MB for the
  # pair - the multi-gigabyte numbers elsewhere here are resident memory.
  - models/**/*
  # onnxruntime-node ships prebuilt binaries for every platform it supports,
  # and two copies of the package end up installed (a top-level one and one
  # nested under @huggingface/transformers). In a Windows-only AppX the macOS
  # and Linux binaries are pure dead weight: measured at 75MB + 57MB per copy,
  # ~260MB across both, on a package where size is a real Store concern. The
  # win32 binaries this app actually loads are untouched.
  - "!node_modules/onnxruntime-node/bin/napi-v6/darwin${/*}"
  - "!node_modules/onnxruntime-node/bin/napi-v6/linux${/*}"
  - "!node_modules/@huggingface/transformers/node_modules/onnxruntime-node/bin/napi-v6/darwin${/*}"
  - "!node_modules/@huggingface/transformers/node_modules/onnxruntime-node/bin/napi-v6/linux${/*}"
  # node-llama-cpp's own bins/ directory only holds .moved.txt pointers on an
  # installed tree (the real binaries live in @node-llama-cpp/*), but exclude
  # the non-Windows ones anyway so a different install layout cannot smuggle
  # them in. The @node-llama-cpp CUDA and Vulkan packages are deliberately
  # KEPT: they are ~630MB, but GPU offload was measured at roughly 4x faster
  # term detection (12s vs 40-60s per call), which is the difference between
  # term cards arriving during a lecture and arriving after it.
  - "!node_modules/node-llama-cpp/bins/mac-${/*}"
  - "!node_modules/node-llama-cpp/bins/linux-${/*}"
  # transformers.js defaults its model cache to a .cache directory INSIDE its
  # own package (native/whisper.js overrides env.cacheDir to ~/.demist for
  # exactly this reason). Anything downloaded before that override, or by any
  # stray script that forgets it, lands here and gets packaged: this was
  # measured at 1.6GB in a real build, more than half the package, and is the
  # actual reason the .appx was ~2GB. Excluded so it can never happen again
  # even if the directory reappears. Models are downloaded at runtime to
  # ~/.demist and must never be bundled.
  - "!node_modules/@huggingface/transformers/.cache${/*}"
# Everything the workers touch has to live OUTSIDE the asar, and that means
# every transitive dependency too, not just the packages named directly.
#
# The three workers are forked child processes running
# app.asar.unpacked/native/worker.js (a child process cannot execute a script
# from inside an asar). Node resolves modules by walking up from the script's
# own directory, so from there it looks in app.asar.unpacked/node_modules and
# then leaves the app entirely - it NEVER looks inside app.asar/node_modules.
#
# Listing only onnxruntime-node and @huggingface/transformers therefore
# shipped a package where transcription could not start at all:
#
#     Error occurred in handler for 'demist:preloadWhisper':
#     Error: Cannot find module 'onnxruntime-common'
#
# onnxruntime-common is a dependency OF onnxruntime-node, was left inside the
# asar, and was unreachable. Caught by running the built exe rather than by
# reading this file; nothing in the build output hinted at it, and the app
# started and looked healthy right up until a recording produced no text.
#
# Unpacking node_modules wholesale rather than chasing the dependency closure
# is deliberate: the closure has to be re-derived every time a dependency
# updates, a single miss is another silently broken build, and the cost here is
# only file count - the bytes are identical and the .appx compresses either
# way. Correctness over tidiness for something that cannot be checked by
# looking at it.
asarUnpack:
  - native/**/*
  - node_modules/**/*
  # onnxruntime reads these off the filesystem, and native/whisper.js points
  # env.localModelPath at app.asar.unpacked/models, so they cannot live
  # inside the archive.
  - models/**/*

# Target is "appx", not "msix": confirmed by an actual build attempt that
# the installed electron-builder (26.15.3) only ships AppXOptions, not
# MsixOptions, msix support only exists on electron-builder's unreleased
# main branch. .appx is still directly accepted by Partner Center (Microsoft
# recommends wrapping it as .appxupload at submission time, but doesn't
# require it) so this isn't a blocker, just means using the older key name.
win:
  target: [appx]
  icon: ../web/public/icon-512.png

appx:
  # Assigned by Microsoft when the app name was reserved in Partner Center, and
  # copied verbatim from Product management -> Product identity. These are not
  # editable values: identityName and publisher must match the account's own
  # certificate exactly or the package is rejected at upload.
  #
  # The publisher GUID looking nothing like a name is correct and deliberate -
  # it is the account's identity, not a display string. PublisherDisplayName
  # below is the human-readable one.
  identityName: Demist.Demist
  publisher: CN=99817A35-A5E3-4E7A-8F44-601153999894
  publisherDisplayName: Demist
  displayName: Demist
  # electron-builder defaults these to 10.0.14316.0 - Windows 10 build 14316,
  # from April 2016 - which is a promise this app cannot keep. Electron 43's
  # Chromium requires Windows 10 1809 (build 17763) or newer, so leaving the
  # default would have let the Store offer Demist to machines where it cannot
  # launch at all, and the user would see an install that simply does nothing.
  # MaxVersionTested is what the app has actually been run against.
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  # microphone: mic recording is the app's core feature. runFullTrust is
  # auto-added by electron-builder for every Electron app regardless.
  # Declaring only what's actually used matters: Store certification checks
  # that requested capabilities match real functionality.
  capabilities:
    # internetClient is NOT a default. electron-builder's getCapabilities()
    # emits exactly what is listed here plus runFullTrust and nothing else, so
    # declaring only `microphone` shipped a package that never declared it
    # needed the network at all - while the app downloads its models from
    # Hugging Face on first run and loads its interface from demist.app.
    #
    # Store certification failed 10.1.2.10 with "Product fails to load
    # on-device model showing error message 'Couldn't load the transcription
    # model'", observed on a machine with a working internet connection. An
    # undeclared network capability is the first thing to rule out for that,
    # and declaring it is correct regardless of whether it was the cause: the
    # app genuinely is an internet client.
    - internetClient
    - microphone
