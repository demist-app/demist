name: Build macOS desktop app

# Builds an unsigned/ad-hoc Apple Silicon build. No Apple Developer Program
# membership exists yet (see desktop/MACOS_BUILD_PLAN.md section 5 for the
# additive change - an identity + notarize step - once one does), so this
# produces a .dmg/.zip that Gatekeeper will block on first launch until the
# user goes through System Settings -> Privacy & Security -> Open Anyway.
# That's expected for now, not a bug in this workflow.
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch: {}

jobs:
  build-mac:
    runs-on: macos-14   # Apple Silicon (arm64) runner
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled Whisper models
        run: node scripts/fetch-models.mjs

      - name: Verify the right native binaries actually installed
        # Fails loudly here rather than shipping a package that looks healthy
        # right up until a recording produces no text - npm's optionalDependencies
        # mechanism should pull the mac-arm64-metal / darwin-arm64 binaries
        # automatically on this runner, but "should" isn't "does".
        run: |
          test -d node_modules/@node-llama-cpp/mac-arm64-metal || (echo "::error::mac-arm64-metal binary missing - term detection would silently fail" && exit 1)
          test -d node_modules/onnxruntime-node/bin/napi-v6/darwin/arm64 || (echo "::error::onnxruntime darwin/arm64 binary missing - transcription would silently fail" && exit 1)
          echo "native binaries present"

      - name: Build (unsigned / ad-hoc)
        env:
          # Prevents electron-builder from hunting for a local certificate
          # that doesn't exist on a fresh runner and failing confusingly.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # ONCE an Apple Developer Program membership exists, uncomment and
          # add the matching repo Secrets - nothing else about this workflow
          # needs to change:
          # CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: demist-mac-arm64
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          retention-days: 30

      # Runs AFTER the artifact is already uploaded, deliberately: a failure
      # here should not hide a build that otherwise succeeded and is worth
      # downloading to investigate. This cannot replace the real-hardware
      # checklist in MACOS_BUILD_PLAN.md section 7 - it never touches
      # Gatekeeper, a mic permission dialog, or the packaged .app - but no
      # environment available while writing this (no physical Mac, and a
      # sandboxed dev machine that cannot even download this workflow's own
      # artifacts over the network) could do that either, so this is the
      # closest real signal obtainable: does transcription/term-detection/
      # translation actually produce output, and which GPU backend
      # node-llama-cpp picked, running for real on this runner's arm64
      # macOS, not inferred from a green `electron-builder` exit code.
      - name: Fast deterministic tests (npm test)
        run: npm test

      - name: Verify transcription, term detection and translation actually work on arm64 macOS
        run: npm run test:mac-verify

      # spctl is Gatekeeper's own command-line entry point - the actual
      # decision engine behind the "can't be opened because Apple cannot
      # verify it is free of malware" dialog, not a guess at what it does.
      # This cannot reproduce the Finder dialog's exact wording or let
      # anyone click "Open Anyway" (that needs a real GUI session - see
      # MACOS_BUILD_PLAN.md section 7), but it confirms for real, on the
      # same unsigned/ad-hoc build this workflow just produced, that
      # Gatekeeper's policy engine actually rejects it the way the plan
      # assumes - rather than that assumption going untested until someone
      # with a physical Mac happens to try it.
      - name: Check Gatekeeper's actual assessment of the unsigned build
        run: |
          APP=$(find dist -maxdepth 2 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then echo "::error::no .app bundle found under dist/ - packaging step did not produce one" && exit 1; fi
          echo "app bundle: $APP"
          echo ""
          echo "codesign -dvv (expect ad-hoc: no Developer ID, this is correct until MACOS_BUILD_PLAN.md section 5 is implemented):"
          codesign -dvv "$APP" 2>&1 || true
          echo ""
          echo "spctl --assess -vv (Gatekeeper's own verdict on this exact build):"
          if spctl --assess -vv "$APP" 2>&1; then
            echo "::warning::Gatekeeper ACCEPTED an unsigned/ad-hoc build - unexpected, re-check whether this still needs the Open Anyway workaround documented in section 4a"
          else
            echo "::notice::Gatekeeper rejects this build as expected for an unsigned/ad-hoc app (see spctl output above for the exact reason) - the Open Anyway recovery path in MACOS_BUILD_PLAN.md section 4a is still what a real user needs, this just confirms the rejection itself is real and not merely assumed"
          fi
